<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action ou Vérité - Dark Neon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Action ou Vérité 🌌</h1>
    
    <div id="player-setup">
        <input type="text" id="playerName" placeholder="Nom du joueur">
        <button id="addPlayerBtn">Ajouter joueur</button>
        <ul id="playerList"></ul>
        <button id="startGameBtn" class="hidden">Commencer le jeu</button>
    </div>

    <div id="gameArea" class="hidden">
        <h2 id="currentPlayer"></h2>
        <div class="buttons">
            <button id="actionBtn">Action</button>
            <button id="truthBtn">Vérité</button>
        </div>
        <div id="challenge" class="hidden"></div>
        <button id="nextBtn" class="hidden">Joueur suivant</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
