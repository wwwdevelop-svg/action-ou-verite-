<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Action ou Vérité</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="home">
  <h1>🎮 Action ou Vérité</h1>
  <input id="username" placeholder="Ton pseudo">
  <button id="createBtn">Créer un salon</button>
  <input id="roomCode" placeholder="Code du salon">
  <button id="joinBtn">Rejoindre</button>
</div>

<div id="lobby" class="hidden">
  <h2>Salon : <span id="code"></span></h2>
  <ul id="players"></ul>
  <select id="mode">
    <option value="classic">Classique</option>
    <option value="adult">Adulte 🔞</option>
    <option value="extreme">Extrême 🔥</option>
  </select>
  <button id="startGameBtn">Démarrer</button>
</div>

<div id="game" class="hidden">
  <h2 id="turn"></h2>
  <button id="actionBtn">Action</button>
  <button id="truthBtn">Vérité</button>
  <p id="challenge"></p>
  <p id="timer">⏱️ 30</p>
  <button id="refuseBtn">❌ Refuser</button>
</div>

<div id="webcamMenu" class="hidden">
  <h3>🎥 Webcam</h3>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="startCamBtn">Activer la caméra</button>
  <button id="stopCamBtn">Désactiver</button>
  <button id="toggleMicBtn">🎤 Micro ON / OFF</button>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="msg" placeholder="Message...">
  <button id="sendMsgBtn">Envoyer</button>
</div>

<!-- socket.io client is served by the server at /socket.io/socket.io.js -->
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
