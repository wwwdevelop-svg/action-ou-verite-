name: Build and publish Docker image to GHCR
on:
  push:
    branches: [ feat/action-ou-verite ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/action-ou-verite:${{ github.sha }}

      - name: Create latest tag
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/action-ou-verite:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/action-ou-verite:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/action-ou-verite:latest
          docker push ghcr.io/${{ github.repository_owner }}/action-ou-verite:latest
